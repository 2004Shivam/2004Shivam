<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink1 { 0%,100%{opacity:1} 50%{opacity:0.2} }
      @keyframes blink2 { 0%,100%{opacity:0.2} 50%{opacity:1} }
      @keyframes blink3 { 0%,33%{opacity:1} 33%,66%{opacity:0.2} 66%,100%{opacity:0.7} }
      @keyframes scanline { 0%{transform:translateY(-10px)} 100%{transform:translateY(290px)} }
      @keyframes flicker { 0%,98%,100%{opacity:1} 99%{opacity:0.85} }
      @keyframes cursor { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .b1 { animation: blink1 2.1s infinite; }
      .b2 { animation: blink2 1.7s infinite; }
      .b3 { animation: blink3 3.3s infinite; }
      .scan { animation: scanline 4s linear infinite; }
      .flicker { animation: flicker 5s infinite; }
      .cursor { animation: cursor 1s step-end infinite; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A10"/>
      <stop offset="100%" style="stop-color:#0F0F1A"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C5CFF;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#7C5CFF;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#FF5CF7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF5CF7;stop-opacity:0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="280"/></clipPath>
  </defs>

  <!-- bg -->
  <rect width="900" height="280" fill="url(#bgGrad)"/>

  <!-- subtle grid -->
  <g opacity="0.04" stroke="#7C5CFF" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
  </g>

  <!-- scanline effect -->
  <g clip-path="url(#clip)">
    <rect class="scan" x="0" y="0" width="900" height="2" fill="#7C5CFF" opacity="0.05"/>
  </g>

  <!-- top-left pixel dots -->
  <rect x="60" y="52" width="10" height="10" rx="2" fill="#7C5CFF" class="b1" filter="url(#glow)"/>
  <rect x="78" y="52" width="10" height="10" rx="2" fill="#FDBA74" class="b2" filter="url(#glow)"/>
  <rect x="96" y="52" width="10" height="10" rx="2" fill="#A7F3D0" class="b3" filter="url(#glow)"/>
  <rect x="114" y="52" width="10" height="10" rx="2" fill="#FF5CF7" class="b1" filter="url(#glow)"/>

  <!-- small label -->
  <text x="60" y="44" font-family="monospace" font-size="10" fill="#7C5CFF" opacity="0.6">[ lab notebook v∞ ]</text>

  <!-- main title -->
  <text x="60" y="140" font-family="monospace" font-size="30" font-weight="bold" fill="#EAEAF0" class="flicker" filter="url(#softglow)">I poke software until it becomes fun.</text>
  <text class="cursor" x="722" y="140" font-family="monospace" font-size="30" fill="#7C5CFF">▍</text>

  <!-- subtitle -->
  <text x="60" y="174" font-family="monospace" font-size="14" fill="#9A9AB0">small experiments · curious behavior · fewer instructions</text>

  <!-- divider line -->
  <line x1="60" y1="198" x2="840" y2="198" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- bottom tags -->
  <rect x="60" y="215" width="130" height="24" rx="4" fill="#7C5CFF" opacity="0.15"/>
  <text x="72" y="231" font-family="monospace" font-size="11" fill="#A89BFF">✦ ui experiments</text>

  <rect x="202" y="215" width="124" height="24" rx="4" fill="#FF5CF7" opacity="0.1"/>
  <text x="214" y="231" font-family="monospace" font-size="11" fill="#FF9BF7">✦ weird tools</text>

  <rect x="338" y="215" width="148" height="24" rx="4" fill="#A7F3D0" opacity="0.1"/>
  <text x="350" y="231" font-family="monospace" font-size="11" fill="#6BDBBB">✦ interaction design</text>

  <rect x="498" y="215" width="138" height="24" rx="4" fill="#FDBA74" opacity="0.1"/>
  <text x="510" y="231" font-family="monospace" font-size="11" fill="#FDBA74">✦ indie hacker mode</text>

  <!-- corner decoration -->
  <rect x="840" y="52" width="4" height="4" fill="#7C5CFF" opacity="0.5"/>
  <rect x="848" y="52" width="4" height="4" fill="#7C5CFF" opacity="0.3"/>
  <rect x="840" y="60" width="4" height="4" fill="#7C5CFF" opacity="0.3"/>
  <rect x="848" y="60" width="4" height="4" fill="#7C5CFF" opacity="0.2"/>
</svg>
